name: Deploy Agendamiento IA a Producción

# Se activa con cada push a 'main'.
on:
  push:
    branches:
      - main

jobs:
  # Barrera de calidad: reutiliza ci.yml en vez de duplicar sus pasos, así no
  # hay forma de que las dos definiciones se separen con el tiempo.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Despliegue en Ubuntu VPS
    runs-on: ubuntu-latest
    # 🚧 Sin esto, un push a `main` con las pruebas en rojo llegaba igual a
    # producción: deploy.yml era el ÚNICO workflow del repo y no corría una
    # sola prueba antes de entrar por SSH al VPS.
    needs: ci

    steps:
      - name: 🚀 Conectar, Actualizar y Levantar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: APP_DIR
          script: |
            set -euo pipefail

            # Ruta del despliegue en el servidor. Configurable por si el VPS no
            # usa la ruta por defecto del instalador.
            APP_DIR="${APP_DIR:-/home/deploy/ai-booking}"
            cd "$APP_DIR"

            # --- Stack de producción -------------------------------------------
            # docker-compose.deploy.yml, NO docker-compose.prod.yml (eliminado):
            # el legacy traía la contraseña de Postgres escrita en el YAML y
            # exportaba REDIS_HOST/REDIS_PORT, que la API no lee.
            # Ver docs/INSTALACION_VPS.md §13.
            #
            # Todos los secretos viven en .env.production (chmod 600, en el
            # servidor, fuera de git y fuera de la imagen). --env-file es
            # obligatorio: alimenta la interpolación ${...} del compose.
            if [ ! -f .env.production ]; then
              echo "✗ Falta $APP_DIR/.env.production — el stack no puede arrancar." >&2
              echo "  Genéralo con: bash deploy/install-vps.sh" >&2
              exit 1
            fi

            DC="docker compose --env-file .env.production -f docker-compose.deploy.yml"

            # 1. Traer los últimos cambios.
            git pull origin main

            # 2. Construir primero: la versión anterior sigue sirviendo mientras tanto.
            $DC build api web

            # 3. Migrar ANTES de recrear los servicios. `migrator` es un contenedor
            #    efímero que comparte imagen con `api` (perfil "tools").
            $DC run --rm migrator

            # 4. Recrear solo lo que cambió. postgres y redis no se tocan:
            #    `up -d` respeta los contenedores cuya definición no varió.
            $DC up -d

            # 5. Confirmar que quedó todo arriba.
            $DC ps
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
