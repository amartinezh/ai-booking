# docker-compose.yml — infraestructura LOCAL de desarrollo.
#
# Las credenciales NO viven en este archivo (está trackeado en git). Salen del
# `.env` de la raíz, que docker compose carga solo y que está en .gitignore.
# `./scripts/up.sh` lo genera con `openssl rand -hex 16` si no existe.
# La sintaxis ${VAR:?mensaje} aborta el `up` con un error claro si falta.
#
# Producción NO usa este archivo: ver docker-compose.deploy.yml + .env.production.

services:
  postgres:
    image: postgres:15-alpine
    container_name: agenia_db
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env (corre ./scripts/up.sh)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env (corre ./scripts/up.sh)}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env (corre ./scripts/up.sh)}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: agenia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # Simulador local del SQL Server del hospital, SOLO para el driver
  # cnt-sanvicente-anserma (apps/mirror-agent/local-his-mock/). SQL Server
  # real (no Azure SQL Edge: esa imagen quedó EOL y revienta con SIGABRT al
  # arrancar en este host) bajo emulación amd64 — este host es Apple Silicon
  # y la imagen oficial de SQL Server solo existe para amd64. Ver
  # apps/mirror-agent/local-his-mock/README.md.
  mirror-his-mock:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: agenia_mirror_his_mock
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MIRROR_HIS_MOCK_SA_PASSWORD:?falta MIRROR_HIS_MOCK_SA_PASSWORD en .env (corre ./scripts/up.sh)}
    ports:
      - "${HIS_MOCK_PORT:-1433}:1433"
    volumes:
      - mirror_his_mock_data:/var/opt/mssql

volumes:
  postgres_data:
  redis_data:
  mirror_his_mock_data:
